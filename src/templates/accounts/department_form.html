{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-br from-indigo-50 via-white to-blue-50">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        
        <!-- Header / Icon -->
        <div class="px-8 pt-8 pb-6 text-center">
            
            <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Create Department</h2>
            <p class="mt-2 text-sm text-gray-600">Add a new functional unit to your organization</p>
        </div>

        <!-- Form Body -->
        <div class="px-8 pb-10">
            <form method="POST" class="space-y-4 department-form">
                {% csrf_token %}
                
                <!-- This styles the auto-generated Django form fields -->
                <div class="django-form-wrapper">
                    {{ form.as_p }}
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col gap-3 pt-4">
                    <button type="submit" 
                        class="w-full bg-indigo-600 text-white py-3 px-4 rounded-xl hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all font-bold text-base shadow-lg shadow-indigo-100 transform active:scale-[0.98]">
                        Save Department
                    </button>
                    
                    <a href="https://app.scalesphere.space/users/tenant_homepage/{{ tenant_url }}" 
                        class="w-auto text-center py-3 text-sm font-semibold text-gray-500 hover:text-gray-700 hover:bg-gray-50 rounded-xl transition-colors">
                        Cancel and return
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    /* Styling the Django form.as_p output to match Tailwind inputs */
    .django-form-wrapper p {
        margin-bottom: 1rem;
    }
    .django-form-wrapper label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: #374151; /* gray-700 */
        margin-bottom: 0.5rem;
    }
    .django-form-wrapper input, 
    .django-form-wrapper select, 
    .django-form-wrapper textarea {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #D1D5DB; /* gray-300 */
        border-radius: 0.5rem; /* rounded-lg */
        outline: none;
        transition: all 0.2s;
    }
    .django-form-wrapper input:focus {
        border-color: transparent;
        box-shadow: 0 0 0 2px #6366F1; /* indigo-500 focus ring */
    }
    /* Simple error styling if Django adds ul.errorlist */
    .errorlist {
        color: #EF4444;
        font-size: 0.875rem;
        margin-bottom: 1rem;
        list-style: none;
        padding-left: 0;
    }
</style>
{% endblock %}
